<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <meta http-equiv="refresh" content="0; url=record-transaction.html">
    <link rel="icon" href="assets/dalla-tab-mark.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/lucide@0.468.0"></script>
    <script type="module" src="https://mavue.mavo.io/mavue.js"></script>
    <script>window.location.replace("record-transaction.html");</script>

</head>
<body style="--pico-spacing: 0.7rem; --pico-block-spacing-vertical: 0.6rem; --pico-typography-spacing-vertical: 0.6rem; --pico-form-element-spacing-vertical: 0.55rem; --pico-nav-element-spacing-vertical: 0.5rem;">

<v-app
    id="app"
    data='{
        "amount": "",
        "expenseFor": "shared",
        "neoShare": 50,
        "trinityShare": 50,
        "paidNeo": 0,
        "paidTrinity": 0,
        "paidJoint": 0,
        "category": "groceries",
        "notes": ""
    }'
>

<div class="container">

    <header class="topbar">
        <div class="topbar-actions">
            <details class="mobile-menu"><summary aria-label="Open navigation menu"><i data-lucide="menu" aria-hidden="true"></i></summary><nav aria-label="Mobile navigation"><a href="index.html">Dashboard</a><a href="record-transaction.html">Record payment</a><a href="transactions.html">Payment history</a><a href="record-settlement.html">Pay someone back</a><a href="add-expense.html">Extra details</a></nav></details>
        </div>
        <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/dalla-tab-mark.svg" width="32" height="32" alt=""></span><span>Dalla Tab</span></a>
        <div class="topbar-actions"><a class="account-link" href="#profile"><span class="avatar">A</span><span class="account-name">Account</span></a></div>
    </header>

    <div class="section">
        <p><em>Record a new expense and specify who should pay vs who actually paid</em></p>
        <hr>
    </div>

    <form id="expense-form" @submit.prevent>

        <div class="section">
            <h2>Total Expense</h2>
            <label>Total Amount (BZD): *</label>
            <input type="number" name="amount" step="0.01" v-model="amount">
            <hr>
        </div>

        <div class="section">
            <h2>Expense Split — Who Should Pay?</h2>
            <label><input type="radio" name="expense_for" value="neo" v-model="expenseFor"> Neo (personal)</label><br>
            <label><input type="radio" name="expense_for" value="trinity" v-model="expenseFor"> Trinity (personal)</label><br>
            <label><input type="radio" name="expense_for" value="shared" v-model="expenseFor"> Shared (50/50)</label><br>
            <label><input type="radio" name="expense_for" value="custom" v-model="expenseFor"> Custom split</label><br><br>

            <label>Neo share (%):</label>
            <input type="number" name="neo_share" v-model="neoShare"><br><br>

            <label>Trinity share (%):</label>
            <input type="number" name="trinity_share" v-model="trinityShare">
            <hr>
        </div>

        <div class="section">
            <h2>Payment Split — Who Actually Paid?</h2>
            <label>Neo paid (BZD):</label>
            <input type="number" name="paid_neo" v-model="paidNeo"><br><br>

            <label>Trinity paid (BZD):</label>
            <input type="number" name="paid_trinity" v-model="paidTrinity"><br><br>

            <label>Joint Account paid (BZD):</label>
            <input type="number" name="paid_joint" v-model="paidJoint">
            <hr>
        </div>

        <div class="section">
            <h2>Category</h2>
            <select name="category" v-model="category">
                <option value="groceries">Groceries</option>
                <option value="utilities">Utilities</option>
                <option value="rent">Rent</option>
                <option value="household">Household Items</option>
                <option value="transportation">Transportation</option>
                <option value="other">Other</option>
            </select>
            <hr>
        </div>

        <div class="section">
            <h2>Notes (optional)</h2>
            <textarea rows="3" cols="40" v-model="notes"></textarea>
            <hr>
        </div>

    </form>

    <!-- QUICK ACTIONS -->
    <div class="section">
        <strong>Quick Actions:</strong>
        <button type="submit" form="expense-form">Save Expense</button> |
        <button type="reset" form="expense-form">Clear Form</button> |
        <button disabled>Auto-calc (placeholder)</button>
        <hr>
    </div>

</div>

</v-app>

<script>if (window.lucide) window.lucide.createIcons();</script>
<script src="js/ui.js"></script>

</body>
</html>
