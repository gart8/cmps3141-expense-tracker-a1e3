<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History | Dalla Tab</title>
    <link rel="icon" href="assets/dalla-tab-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/lucide@0.468.0"></script>
    <script type="module" src="js/transactions.js"></script>
    <style>
        .transaction-filters {
            align-items: end;
            gap: 1rem;
        }

        .transaction-filters label {
            margin-bottom: 0;
        }

        @media (max-width: 700px) {
            .transaction-filters {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body style="--pico-spacing: 0.7rem; --pico-block-spacing-vertical: 0.6rem; --pico-typography-spacing-vertical: 0.6rem; --pico-form-element-spacing-vertical: 0.55rem; --pico-nav-element-spacing-vertical: 0.5rem;">

<div id="app">
    <header class="container">
        <nav>
            <ul>
                <li><details class="dropdown">
                    <summary aria-label="Open menu"><i data-lucide="menu" aria-hidden="true"></i></summary>
                    <ul>
                        <li><a href="index.html">Dashboard</a></li>
                        <li><a href="record-transaction.html">Record payment</a></li>
                        <li><a href="transactions.html">Payment history</a></li>
                        <li><a href="record-settlement.html">Pay someone back</a></li>
                        <li><a href="#settings">Settings</a></li>
                        <li><a href="#help">Help</a></li>
                    </ul>
                </details></li>
                <li><a href="index.html"><strong><img src="assets/dalla-tab-mark.svg" width="32" height="32" alt=""> Dalla Tab</strong></a></li>
            </ul>
            <ul><li><a href="#profile">Account</a></li></ul>
        </nav>
    </header>

    <main class="container">
        <p><mark>Payments</mark></p>
        <h1>Payment history</h1>
        <p>Find, review, and correct recorded payments.</p>

        <article>
            <header>
                <h2><i data-lucide="list-filter" aria-hidden="true"></i> Find payments</h2>
            </header>
            <div class="grid transaction-filters">
                <label for="search">Search
                    <input id="search" type="search" v-model="searchTerm" placeholder="Description, category, or payer">
                </label>
                <label for="sharing-filter">Sharing status
                    <select id="sharing-filter" v-model="sharingFilter">
                        <option value="all">All payments</option>
                        <option value="none">No sharing needed</option>
                        <option value="shared">Sharing complete</option>
                        <option value="incomplete">Sharing details pending</option>
                        <option value="settlement">Paybacks</option>
                    </select>
                </label>
                <label for="sort-order">Sort
                    <select id="sort-order" v-model="sortOrder">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                    </select>
                </label>
            </div>
        </article>

        <p><strong>{{ filteredTransactions.length }}</strong> payment<span v-if="filteredTransactions.length !== 1">s</span> shown</p>

        <p v-if="filteredTransactions.length === 0">No matching payments found.</p>
        <figure v-else>
            <table>
                <thead>
                    <ul><li><a href="#profile">Account</a></li></ul>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="transaction in filteredTransactions">
                        <td><time :datetime="transaction.date">{{ transaction.date }}</time></td>
                        <td>
                            <strong>{{ transactionTitle(transaction) }}</strong><br>
                            <small>{{ transaction.category || "No category" }}</small>
                        </td>
                        <td><small>{{ payerSummary(transaction) }}</small></td>
                        <td><strong>{{ transactionAmount(transaction) }}</strong></td>
                        <td><small>{{ sharingSummary(transaction) }}</small></td>
                        <td>
                            <span>
                                <button type="button" class="secondary" @click="editTransaction(transaction)" data-tooltip="Edit transaction" aria-label="Edit transaction"><i data-lucide="pencil" aria-hidden="true"></i></button>
                                <button type="button" class="secondary outline" @click="deleteTransaction(transaction)" data-tooltip="Delete transaction" aria-label="Delete transaction"><i data-lucide="trash-2" aria-hidden="true"></i></button>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </figure>
    </main>
</div>

<script>if (window.lucide) window.lucide.createIcons();</script>
<script src="js/ui.js"></script>
</body>
</html>
